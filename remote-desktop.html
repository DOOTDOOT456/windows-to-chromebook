<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote Desktop Client</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0b0f14;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: #11161d;
    border-bottom: 1px solid #1f2733;
    flex-wrap: wrap;
  }
  header h1 { font-size: 14px; font-weight: 600; margin-right: auto; }
  #settingsBtn { background: #1f2733; color: #e6edf3; border: 0; border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #settingsBtn:hover { background: #2a3543; }
  #settingsPanel {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
    background: #11161d; border-top: 1px solid #2a3543;
    padding: 12px 16px; display: none;
    font-size: 13px;
  }
  #settingsPanel input[type="range"] { vertical-align: middle; }
  #settingsPanel label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  #settingsPanel label input { width: auto; vertical-align: middle; }
  header input {
    background: #0b0f14; color: #e6edf3;
    border: 1px solid #2a3543; border-radius: 6px;
    padding: 6px 10px; font-size: 13px; width: 280px;
  }
  button {
    background: #2563eb; color: #fff; border: 0; border-radius: 6px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #333c49; cursor: not-allowed; }
  button.danger { background: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  #status { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #1f2733; }
  #status.connected { background: #14532d; }
  #status.error { background: #7f1d1d; }
  #screen { flex: 1; overflow: auto; background: #000; position: relative; }
  #screen canvas { display: block; margin: auto; }
  #connectPanel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 20px;
  }
  #connectPanel h2 { font-size: 22px; }
  #connectPanel p { color: #8b98a9; font-size: 14px; max-width: 460px; line-height: 1.5; }
  #connectPanel .row { display: flex; gap: 8px; }
  #connectPanel .row button.ghost {
    background: #1f2733; color: #e6edf3;
  }
  #connectPanel .row button.ghost:hover { background: #2a3543; }
  #exampleUrl {
    display: flex; align-items: center; gap: 10px;
    background: #0b0f14; border: 1px solid #2a3543; border-radius: 8px;
    padding: 10px 14px; font-size: 13px;
  }
  #exampleText {
    flex: 1; background: #000; color: #93c5fd; padding: 8px 12px;
    border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #exampleUrl button { white-space: nowrap; }
  #connectPanel input { width: 320px; padding: 10px 12px; font-size: 14px; }
  .hidden { display: none !important; }
  #sendKeys { display: flex; gap: 6px; }
  #sendKeys button { background: #1f2733; }
  #sendKeys button:hover { background: #2a3543; }
  #fatal {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    color: #f87171; font-size: 15px; padding: 20px; text-align: center;
    background: rgba(0,0,0,.75); z-index: 10;
  }
</style>
</head>
<body>
<header>
  <h1>🖥️ Remote Desktop</h1>
  <span id="status">Disconnected</span>
  <div id="sendKeys" class="hidden">
    <button data-ctrl-alt-del>Ctrl+Alt+Del</button>
    <button data-fullscreen>Fullscreen</button>
  </div>
  <button id="btnDisconnect" class="danger hidden">Disconnect</button>
  <button id="settingsBtn" title="Settings">⚙️ Settings</button>
</header>

<div id="settingsPanel">
  <label>Scale viewport <input type="checkbox" id="s_scale" checked></label>
  <label>View only <input type="checkbox" id="s_viewOnly"></label>
  <label>Quality <input type="range" id="s_quality" min="1" max="9" step="1" value="6"></label>
  <label>Encoding <input type="text" id="s_encoding" value="auto" style="width:90px"></label>
  <label>Desktop scaling factor <input type="range" id="s_factor" min="1" max="3" step="0.25" value="1"></label>
  <label>JPEG quality <input type="range" id="s_jpeg" min="1" max="9" step="1" value="6"></label>
  <label>Show cursor <input type="checkbox" id="s_cursor" checked></label>
  <label>Send Ctrl+Alt+Del <input type="checkbox" id="s_ctrlAltDel" checked></label>
  <label>Send Alt+Tab <input type="checkbox" id="s_altTab" checked></label>
  <label>Send Alt+F4 <input type="checkbox" id="s_altF4" checked></label>
  <label>Send Win+D <input type="checkbox" id="s_winD" checked></label>
  <label>Send Escape <input type="checkbox" id="s_escape" checked></label>
  <label>Send Enter <input type="checkbox" id="s_enter" checked></label>
  <label>Send Space <input type="checkbox" id="s_space" checked></label>
  <label>Send Arrows <input type="checkbox" id="s_arrows" checked></label>
  <label>Send Numeric Pad <input type="checkbox" id="s_numpad" checked></label>
  <label>Show send-keys buttons <input type="checkbox" id="s_showKeys" checked></label>
</div>

<div id="screen">
  <div id="connectPanel">
    <h2>Connect to your PC</h2>
    <p>
      Enter the WebSocket address of your desktop server, e.g.<br>
      <code style="color:#93c5fd">wss://pc.example.com/websockify</code><br>
      (Cloudflare Tunnel / your LAN address — see README)
    </p>
    <div class="row">
      <input id="url" type="url" placeholder="wss://pc.example.com/websockify" spellcheck="false">
      <button id="btnConnect">Connect</button>
      <button id="btnUseExample" class="ghost">Use example</button>
    </div>
    <div class="row">
      <input id="password" type="password" placeholder="VNC password (optional)" style="width:180px">
      <label style="font-size:13px;color:#8b98a9"><input type="checkbox" id="scale" checked> Scale to fit</label>
    </div>
  </div>
  <div id="exampleUrl" class="hidden">
    <code id="exampleText"></code>
    <button id="btnCopyUrl">Copy URL</button>
  </div>
  <div id="fatal"></div>
</div>

<!-- noVNC core + WebSockets shim loaded from CDN -->
<script src="https://unpkg.com/@novnc/novnc@1.5.0/lib/rfb.js"></script>

<script>
  const $ = (id) => document.getElementById(id);
  const status = $('status'), panel = $('connectPanel'), screenEl = $('screen'),
        fatal = $('fatal'), btnConnect = $('btnConnect'), btnDisconnect = $('btnDisconnect'),
        sendKeys = $('sendKeys');
  let rfb = null;

  function setStatus(text, cls) {
    status.textContent = text;
    status.className = cls || '';
  }

  function connect() {
    const url = $('url').value.trim();
    if (!url) { $('url').focus(); return; }
    fatal.style.display = 'none';
    btnConnect.disabled = true;
    setStatus('Connecting…');
    try {
      rfb = new RFB(screenEl, url, { credentials: { password: $('password').value } });
    } catch (e) {
      showFatal('Failed to start connection: ' + e.message);
      return;
    }
    rfb.scaleViewport = $('scale').checked;
    rfb.resizeSession = false;
    rfb.background = '#000';

    rfb.addEventListener('connect', () => {
      setStatus('Connected', 'connected');
      panel.classList.add('hidden');
      btnDisconnect.classList.remove('hidden');
      sendKeys.classList.remove('hidden');
      btnConnect.disabled = false;
    });
    rfb.addEventListener('disconnect', (e) => {
      setStatus('Disconnected');
      panel.classList.remove('hidden');
      btnDisconnect.classList.add('hidden');
      sendKeys.classList.add('hidden');
      btnConnect.disabled = false;
      if (e.detail && e.detail.clean === false) showFatal('Connection lost or refused. Check the URL, the server, and that it uses ws:// or wss:// correctly.');
      rfb = null;
    });
    rfb.addEventListener('credentialsrequired', () => {
      rfb.sendCredentials({ password: $('password').value });
    });
  }

  function showFatal(msg) {
    fatal.textContent = msg;
    fatal.style.display = 'flex';
    btnConnect.disabled = false;
    setStatus('Error', 'error');
  }

  function disconnect() {
    if (rfb) rfb.disconnect();
  }

  btnConnect.addEventListener('click', connect);
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
  $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') connect(); });
  btnDisconnect.addEventListener('click', disconnect);
  btnDisconnect.addEventListener('click', disconnect);
  sendKeys.querySelector('[data-ctrl-alt-del]').addEventListener('click', () => rfb && rfb.sendCtrlAltDel());
  sendKeys.querySelector('[data-fullscreen]').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else screenEl.requestFullscreen();
  });
  $('scale').addEventListener('change', (e) => { if (rfb) rfb.scaleViewport = e.target.checked; });

  // ---------- Settings panel ----------
  $('settingsBtn').addEventListener('click', () => {
    $('settingsPanel').style.display = $('settingsPanel').style.display === 'block' ? 'none' : 'block';
  });

  // Read the filter controls into the RFB options.
  function readSettings() {
    return {
      scaleViewport: $('s_scale').checked,
      viewOnly: $('s_viewOnly').checked,
      quality: Number($('s_quality').value),
      encoding: $('s_encoding').value,
      desktopScalingFactor: Number($('s_factor').value),
      jpegQuality: Number($('s_jpeg').value),
      showCursor: $('s_cursor').checked
    };
  }

  // Apply settings to the active RFB session.
  function applySettings(opts) {
    if (!rfb) return;
    Object.assign(rfb, opts);
    if (opts.scaleViewport !== undefined) rfb.scaleViewport = opts.scaleViewport;
    if (opts.viewOnly !== undefined) rfb.viewOnly = opts.viewOnly;
    if (opts.quality !== undefined) rfb.quality = opts.quality;
    if (opts.encoding !== undefined) rfb.encoding = opts.encoding;
    if (opts.desktopScalingFactor !== undefined) rfb.desktopScalingFactor = opts.desktopScalingFactor;
    if (opts.jpegQuality !== undefined) rfb.jpegQuality = opts.jpegQuality;
    if (opts.showCursor !== undefined) rfb.showCursor = opts.showCursor;
    rfb.resizeSession = false;
  }

  // Sync UI with RFB on connect.
  rfb.addEventListener('connect', () => {
    $('s_scale').checked = rfb.scaleViewport;
    $('s_viewOnly').checked = rfb.viewOnly;
    $('s_quality').value = rfb.quality || 6;
    $('s_encoding').value = rfb.encoding || 'auto';
    $('s_factor').value = rfb.desktopScalingFactor || 1;
    $('s_jpeg').value = rfb.jpegQuality || 6;
    $('s_cursor').checked = rfb.showCursor !== false;
  });

  // Listen to the settings UI.
  $('s_scale').addEventListener('change', (e) => { if (rfb) applySettings({ scaleViewport: e.target.checked }); });
  $('s_viewOnly').addEventListener('change', (e) => { if (rfb) applySettings({ viewOnly: e.target.checked }); });
  $('s_quality').addEventListener('input', (e) => { if (rfb) applySettings({ quality: Number(e.target.value) }); });
  $('s_encoding').addEventListener('change', (e) => { if (rfb) applySettings({ encoding: e.target.value }); });
  $('s_factor').addEventListener('input', (e) => { if (rfb) applySettings({ desktopScalingFactor: Number(e.target.value) }); });
  $('s_jpeg').addEventListener('input', (e) => { if (rfb) applySettings({ jpegQuality: Number(e.target.value) }); });
  $('s_cursor').addEventListener('change', (e) => { if (rfb) applySettings({ showCursor: e.target.checked }); });

  // ---------- Control keys ----------
  function bindCtrlKeys(prefix, map, keys) {
    keys.forEach((k) => {
      const id = prefix + k;
      const cb = () => rfb && rfb.sendKeyMap ? rfb.sendKeyMap(map) : console.warn('sendKeyMap not available');
      document.getElementById(id).addEventListener('change', (e) => {
        if (e.target.checked) cb();
      });
    });
  }

  bindCtrlKeys('s_ctrl', { ctrlKey: true, altKey: true, key: 'Control' }, ['sendCtrlAltDel']);
  bindCtrlKeys('s_alt', { ctrlKey: false, altKey: true, key: 'Tab' }, ['sendAltTab']);
  bindCtrlKeys('s_altF4', { key: 'F4', altKey: true }, ['sendAltF4']);
  bindCtrlKeys('s_winD', { metaKey: true, key: 'd' }, ['sendWinD']);
  bindCtrlKeys('s_escape', { key: 'Escape' }, ['sendEsc']);
  bindCtrlKeys('s_enter', { key: 'Enter' }, ['sendEnter']);
  bindCtrlKeys('s_space', { key: 'Space' }, ['sendSpace']);
  bindCtrlKeys('s_arrows', { key: 'Arrows' }, ['sendArrowKeys']);
  bindCtrlKeys('s_numpad', { key: 'Numpad' }, ['sendNumericPad']);

  document.getElementById('s_showKeys').addEventListener('change', (e) => {
    $('sendKeys').style.display = e.target.checked ? 'flex' : 'none';
  });

  // Quick-add the example connection URL, then connect automatically.
  $('btnUseExample').addEventListener('click', () => {
    const example = 'wss://pc.your-domain.com/websockify';
    $('url').value = example;
    $('exampleText').textContent = example;
    $('exampleUrl').classList.remove('hidden');
    connect();
  });
  $('btnCopyUrl').addEventListener('click', () => {
    $('exampleText').select();
    document.execCommand('copy');
    $('btnCopyUrl').textContent = 'Copied!';
    setTimeout(() => { $('btnCopyUrl').textContent = 'Copy URL'; }, 1500);
  });

  // Allow pre-filling via URL hash: remote-desktop.html#wss://host/websockify
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash.startsWith('ws')) { $('url').value = hash; connect(); }
</script>
</body>
</html>
